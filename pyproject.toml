[project]
name = "triagebench"
version = "0.1.0"
description = "An AI agent that triages failing GitHub Actions jobs, with MCP tools, pgvector hybrid retrieval and a real evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ahraz Kibria" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "numpy",
    "typer>=0.12",
    "pyyaml",
]

[project.optional-dependencies]
# Local embedding model (Qwen3-Embedding-0.6B). Heavy (pulls torch); CI uses a fake embedder instead.
embed = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "respx",
    "types-PyYAML",
]

[project.scripts]
triagebench = "triagebench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "db: needs a PostgreSQL + pgvector database (TRIAGEBENCH_DATABASE_URL)",
    "live: calls a paid model API (never in CI)",
]
addopts = "-ra -m 'not live'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/triagebench"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
