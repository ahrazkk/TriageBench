name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triagebench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 5s --health-retries 10
    env:
      TRIAGEBENCH_TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/triagebench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: "Install (no embedding model: CI uses the deterministic fake embedder)"
        run: uv sync --python 3.12 --extra dev
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Tests (verifier, reducer, stats, FakeLLM agent, MCP contract, pgvector leakage)
        run: uv run python -m pytest -q
